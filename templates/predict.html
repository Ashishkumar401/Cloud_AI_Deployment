<!DOCTYPE html>
<html>
<head>
  <title>Model Prediction - Cloud AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h2>🔍 Predict Using Trained Model</h2>
    <p>Enter the required feature values below:</p>

    <form method="post">
      <input type="text" name="f1" placeholder="Sepal Length (cm)" required>
      <input type="text" name="f2" placeholder="Sepal Width (cm)" required>
      <input type="text" name="f3" placeholder="Petal Length (cm)" required>
      <input type="text" name="f4" placeholder="Petal Width (cm)" required>
      <button type="submit">Predict 🌿</button>
    </form>

    {% if result %}
      <div class="result">{{ result }}</div>
    {% endif %}

    <a href="/">⬅️ Back to Home</a>
  </div>
</body>
</html>
